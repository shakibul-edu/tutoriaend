<!DOCTYPE html>
<html>
<body style="font-family: Arial; background:#f4f6f8; padding:20px;">
  <div style="max-width:600px; margin:auto; background:#fff; border-radius:10px; overflow:hidden;">

    <div style="background:#4f46e5; color:white; padding:20px; text-align:center;">
      <h2>New Tuition Request 🎓</h2>
    </div>

    <div style="padding:20px;">
      <p>Hello <strong>{{ username }}</strong>,</p>

      <p>You received a new tuition request:</p>

      <p><strong>Student:</strong> {{ student_name }}</p>
      <p><strong>Phone:</strong> {{ student_phone }}</p>
      <p><strong>Budget:</strong> ৳{{ fee_budget }}</p>
      <p><strong>Message:</strong> {{ message }}</p>

      <div style="text-align:center; margin-top:20px;">
        <a href="{{ dashboard_url }}"
           style="background:#4f46e5; color:white; padding:10px 18px; text-decoration:none; border-radius:5px;">
           View Dashboard
        </a>
      </div>
    </div>

  </div>
</body>
</html>
